<!DOCTYPE html>
<html>
<head>
    <title>AI Network Intrusion Detection - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #1f3c64;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2878d4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #185ca8;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>AI Network Intrusion Detection</h2>

    <input
        type="text"
        id="username"
        placeholder="Username"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <div id="message"></div>

</div>

<script>

async function login() {

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (!username || !password) {
        message.style.color = "red";
        message.innerText = "Please enter username and password";
        return;
    }

    try {

        const response = await fetch("http://127.0.0.1:8000/login", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok) {

            // Save JWT token
            localStorage.setItem("access_token", data.access_token);

            message.style.color = "green";
            message.innerText = "Login successful!";

            console.log("JWT Token:", data.access_token);

            // Go to dashboard
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1000);

        } else {

            message.style.color = "red";
            message.innerText =
                data.detail || "Invalid username or password";
        }

    } catch (error) {

        console.error(error);

        message.style.color = "red";
        message.innerText =
            "Cannot connect to backend. Make sure FastAPI is running.";
    }
}

</script>

</body>
</html>
